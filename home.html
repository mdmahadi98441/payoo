<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo | Home</title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">

    <!-- tailwind and daisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <style>


    </style>
</head>

<body class="min-h-screen max-w-[430px] bg-base-200 mx-auto">
    <header class=" border-b-2 border-gray-300  sticky top-0 bg-base-200 z-10">
        <section class="w-11/12 mx-auto py-3 flex justify-between items-center">
            <div class="left flex gap-2">
                <div class="logo w-[60px]">
                    <img src="assets/logo.png" alt="">
                </div>
                <div class="balance-info">
                    <h2 class="text-2xl font-bold">$ <span id="balance">45000</span></h2>
                    <p class="text-neutral/50">Avalable Balance</p>
                </div>
            </div>
            <div class="right">
                <a class="btn btn-soft" href="/index.html">
                    <i class="fa-solid fa-right-from-bracket rotate-180"></i>Logout</a>
            </div>

        </section>
    </header>
    <section class="w-11/12 mx-auto">
        <h2 class="text-3xl font-bold pt-5">Welcome to Pay<span class="text-primary">oo</span></h2>
        <p class="text-neutral/50 pt-3">Enjoy easy and convenient financial services with us. Cashout charge is low and
        </p>

        <div class="buttons mt-4 grid grid-cols-3 gap-3">
            <button onclick="showOnly('add-money')" class="btn flex-col h-full py-3">
                <img src="assets/opt-1.png" alt="">
                <p>Add Money</p>
            </button>
            <button onclick="showOnly('cashout')" class="btn flex-col h-full py-3">
                <img src="assets/opt-2.png" alt="">
                <p>Cashout</p>
            </button>
            <button onclick="showOnly('transfer-money')" class="btn flex-col h-full py-3">
                <img src="assets/opt-3.png" alt="">
                <p>Transfer Money</p>
            </button>
            <button onclick="showOnly('bonus')" class="btn flex-col h-full py-3">
                <img src="assets/opt-4.png" alt="">
                <p>Get Bonus</p>
            </button>
            <button onclick="showOnly('pay-bill')" class="btn flex-col h-full py-3">
                <img src="assets/opt-5.png" alt="">
                <p>Pay Bill</p>
            </button>
            <button onclick="showOnly('history')" class="btn flex-col h-full py-3">
                <img src="assets/opt-6.png" alt="">
                <p>Transactions</p>
            </button>
        </div>
    </section>

    <!-- add money section -->

    <section id="add-money" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-xl font-bold pb-5">Add Money</h2>

        <div class="card bg-base-100 w-full  shadow mx-auto rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label font-semibold text-black">Select bank</label>
                    <select id="account-name" class="select rounded-full w-full bg-base-200">
                        <option disabled selected class="text-neutral/50">Select Bank</option>
                        <option value="Islami bank">Islami bank</option>
                        <option value="Sonali Bank">Sonali Bank</option>
                        <option value="Pubali bank">Pubali bank</option>
                    </select> <br>



                    <label class="label font-semibold text-black">Bank Account Number</label>
                    <input id="add-money-account-number" minlength="11" maxlength="11" type="text"
                        class="input w-full rounded-full bg-base-200" placeholder="Enter 11 Digit Account Number" />
                    <br>

                    <label class="label font-semibold text-black">Amount To Add</label>
                    <input id="add-money-amount" type="number" class="input w-full rounded-full bg-base-200"
                        placeholder="Enter Number to Withdrow" /> <br>

                    <label class="label font-semibold text-black">Pin Number</label>
                    <input id="add-money-pin" minlength="4" maxlength="4" type="password"
                        class="input w-full rounded-full bg-base-200" placeholder="Enter 4 Digit Pin" />

                    <button id="add-money-btn" class="btn btn-primary mt-4 rounded-full">Add Money</button>
                </fieldset>
            </div>
        </div>


    </section>


    <!-- cashout section -->
    <section id="cashout" class="w-11/12 mx-auto py-5 ">
        <h2 class="text-xl font-bold pb-5">CashOut</h2>

        <div class="card bg-base-100 w-full  shadow mx-auto rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label font-semibold text-black">Agent Number</label>
                    <input id="cashout-input" maxlength="11" minlength="11" type="text"
                        class="input w-full rounded-full bg-base-200" placeholder="Enter 11 Digit Number" />
                        <br>

                    <label class="label font-semibold text-black">Amount</label>

                    <input id="cashout-amount" type="number" class="input w-full rounded-full bg-base-200"
                        placeholder="Enter Number to Withdrow" />
                        <br>

                    <label class="label font-semibold text-black">Pin Number</label>
                    <input id="cashout-pin" minlength="4" maxlength="4" type="password"
                        class="input w-full rounded-full bg-base-200" placeholder="Enter 4 Digit Pin" />

                    <button id="cashout-btn" class="btn btn-primary mt-4 rounded-full">Withdraw Money</button>
                </fieldset>
            </div>
        </div>


    </section>

    <!-- trancfer money -->

    <section id="transfer-money" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-xl font-bold pb-5">Transfer Money</h2>

        <div class="card bg-base-100 w-full  shadow mx-auto rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label font-semibold text-black">Transfer Number</label>
                    <input id="transfer-input" maxlength="11" minlength="11" type="text"
                        class="input w-full rounded-full bg-base-200" placeholder="Enter 11 Digit Number" />

                    <label class="label font-semibold text-black">Transfer Amount</label>

                    <input id="transfer-amount" type="number" class="input w-full rounded-full bg-base-200"
                        placeholder="Enter Amount to Transfer" />

                    <label class="label font-semibold text-black">Pin Number</label>
                    <input id="transfer-pin" minlength="4" maxlength="4" type="password"
                        class="input w-full rounded-full bg-base-200" placeholder="Enter 4 Digit Pin" />

                    <button id="transfer-btn" class="btn btn-primary mt-4 rounded-full">Transfer Money</button>
                </fieldset>
            </div>
        </div>


    </section>
    <!-- get bonas -->
    <section id="bonus" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-xl font-bold pb-5">Get Bonus</h2>

        <div class="card bg-base-100 w-full  shadow mx-auto rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label font-semibold text-black">Enter Bonus Coupon</label>
                    <input id="bonus-input" type="text"
                        class="input w-full rounded-full bg-base-200" placeholder="Enter Coupon Number" />


                    
                    <button id="bonus-btn" class="btn btn-primary mt-4 rounded-full">Get Bonus</button>
                </fieldset>
            </div>
        </div>


    </section>

    <!-- pay bill section -->
     <section id="pay-bill" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-xl font-bold pb-5">Pay Bill</h2>

        <div class="card bg-base-100 w-full  shadow mx-auto rounded-2xl">
            <div class="card-body">
                <fieldset class="fieldset">
                    <label class="label font-semibold text-black">Select To Pay</label>
                    <select id="pay-bank-name" class="select rounded-full w-full bg-base-200">
                        <option disabled selected class="text-neutral/50">Select Bank</option>
                        <option value="Islami bank">Islami bank</option>
                        <option value="Sonali Bank">Sonali Bank</option>
                        <option value="Pubali bank">Pubali bank</option>
                    </select> <br>



                    <label class="label font-semibold text-black">Biller Account Number</label>
                    <input id="pay-account-number" minlength="11" maxlength="11" type="text"
                        class="input w-full rounded-full bg-base-200" placeholder="Enter 11 Digit Account Number" />
                    <br>

                    <label class="label font-semibold text-black">Amount To Pay</label>
                    <input id="pay-amount" type="number" class="input w-full rounded-full bg-base-200"
                        placeholder="Enter Number to pay" /> <br>

                    <label class="label font-semibold text-black">Pin Number</label>
                    <input id="pay-pin" minlength="4" maxlength="4" type="password"
                        class="input w-full rounded-full bg-base-200" placeholder="Enter 4 Digit Pin" />

                    <button id="pay-btn" class="btn btn-primary mt-4 rounded-full">Pay Now</button>
                </fieldset>
            </div>
        </div>


    </section>



    <!-- transaction section -->
    <section id="history" class="w-11/12 mx-auto py-5 hidden">
        <h2 class="text-xl font-bold pb-5">Transaction History</h2>
        <div id="history-container" class="space-y-5">

        </div>
    </section>






    <script src="script/machine.js"></script>
    <script src="script/addmoney.js"></script>
    <script src="script/cashout.js"></script>
    <script src="script/transfer.js"></script>
    <script src="script/bonus.js"></script>
    <script src="script/pay.js"></script>

</body>

</html>
